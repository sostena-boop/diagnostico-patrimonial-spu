<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico do imóvel | SPUnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --azul: #1351b4; --azul-escuro: #071d41; --azul-marinho: #0c326f; --azul-claro: #dbe8fb;
  --azul-suave: #f0f5fd; --verde: #168821; --laranja: #e9571e; --vermelho: #e52207;
  --amarelo-bg: #fff5c2; --texto: #1b1b1b; --suave: #555; --linha: #cccccc;
  --cinza: #f8f8f8; --cinza-2: #ededed;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--texto); background: #fff; font: 400 15px/1.45 Rawline, Raleway, "Segoe UI", Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }

/* Barra do protótipo (não faz parte do sistema) */
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 7px 24px; background: #2b2b2b; color: #e6e6e6; font-size: 12px; }
.proto b { color: #ffcd07; letter-spacing: .04em; }
.proto .seg { display: inline-flex; border: 1px solid #666; border-radius: 4px; overflow: hidden; }
.proto .seg button { border: 0; padding: 4px 10px; background: transparent; color: #ddd; cursor: pointer; }
.proto .seg button.on { background: #ffcd07; color: #1b1b1b; font-weight: 600; }
.proto .lk { margin-left: auto; border: 0; background: none; color: #bbb; text-decoration: underline; cursor: pointer; }

/* Cabeçalho SPUnet */
.topo { display: flex; align-items: center; gap: 18px; padding: 16px 40px; box-shadow: 0 1px 6px rgba(0,0,0,.16); position: relative; z-index: 1; }
.menu { width: 18px; height: 14px; border: 0; padding: 0; cursor: pointer; background: linear-gradient(var(--azul) 0 0) top/100% 2px no-repeat, linear-gradient(var(--azul) 0 0) center/100% 2px no-repeat, linear-gradient(var(--azul) 0 0) bottom/100% 2px no-repeat; }
.marca { display: flex; align-items: flex-end; gap: 3px; font-weight: 700; font-size: 24px; letter-spacing: -.02em; line-height: 1; }
.marca span { font-weight: 400; }
.marca i { display: inline-flex; align-items: flex-end; gap: 2px; margin-left: 2px; height: 30px; }
.marca i u { width: 3px; border-radius: 2px; }
.titulo-sis strong { display: block; font-size: 22px; font-weight: 400; line-height: 1.15; }
.titulo-sis small { color: var(--suave); font-size: 13px; }
.topo .dir { margin-left: auto; display: flex; align-items: center; gap: 18px; color: var(--azul); }
.ico { width: 18px; height: 18px; border-radius: 50%; background: var(--azul); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.usuario { display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; border-radius: 999px; background: var(--cinza); color: var(--texto); font-size: 13px; }
.usuario i { width: 36px; height: 36px; border-radius: 50%; background: #d4451c; color: #fff; display: grid; place-items: center; font-style: normal; font-weight: 600; font-size: 18px; }

.pagina { max-width: 1280px; margin: 0 auto; padding: 22px 40px 56px; }
.trilha { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--texto); }
.trilha a { color: var(--azul); text-decoration: none; }
.trilha .sep { color: #999; }
.trilha .tempo { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 26px 0 14px; }
h1 { font-size: 32px; font-weight: 300; line-height: 1.2; }
.tag { display: inline-block; padding: 4px 12px; border-radius: 3px; color: #fff; font-size: 12px; font-weight: 500; text-transform: uppercase; white-space: nowrap; }
.tag.laranja { background: var(--laranja); } .tag.verde { background: var(--verde); } .tag.azul { background: var(--azul); }

/* Passos do módulo (Requerimento · Imóvel · Caracterização · Destinação) */
.passos { display: flex; list-style: none; margin: 8px 0 30px; padding: 0; }
.passos li { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--azul); font-size: 15px; }
.passos li:first-child { align-items: flex-start; flex: .5; } .passos li:last-child { align-items: flex-end; flex: .5; }
.passos li::before { content: ''; position: absolute; top: 19px; left: 0; right: 0; height: 1px; background: #555; }
.passos li:first-child::before { left: 20px; } .passos li:last-child::before { right: 20px; }
.passos li span { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--azul); background: #fff; display: grid; place-items: center; font-size: 20px; }
.passos li.feito span { background: var(--azul-claro); }
.passos li.atual span { background: var(--azul-marinho); border-color: var(--azul-marinho); color: #fff; }
.passos li.atual { font-weight: 600; }

/* Resumo (requerimento / imóvel) */
.resumo h2 { font-size: 26px; font-weight: 400; margin-bottom: 12px; }
.dados { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 32px; padding: 0 0 18px 48px; }
.dados.raso { padding-left: 0; }
.dados div b { display: block; font-size: 13px; font-weight: 600; }
.dados div.larga { grid-column: 1 / -1; }

/* Etapas do diagnóstico (abas) */
.abas { display: flex; gap: 2px; margin: 10px 0 0; border-bottom: 1px solid var(--linha); overflow-x: auto; }
.abas button { flex: 1 0 auto; display: flex; align-items: center; gap: 8px; padding: 12px 14px; border: 0; border-bottom: 4px solid transparent; background: none; color: var(--azul); cursor: pointer; font-size: 14px; white-space: nowrap; }
.abas button:hover { background: var(--azul-suave); }
.abas button i { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--azul); display: grid; place-items: center; font-style: normal; font-size: 12px; }
.abas button.feita i { background: var(--azul-claro); }
.abas button.atual { border-bottom-color: var(--azul); font-weight: 600; }
.abas button.atual i { background: var(--azul-marinho); border-color: var(--azul-marinho); color: #fff; }

.etapa-titulo { margin: 28px 0 4px; font-size: 22px; font-weight: 400; }
.etapa-desc { color: var(--suave); margin-bottom: 8px; }
.bloco { border-top: 1px solid var(--linha); margin-top: 22px; padding-top: 16px; }
.bloco > h3 { color: var(--azul-marinho); font-size: 17px; font-weight: 500; margin-bottom: 14px; }
.bloco h4 { font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: .02em; color: var(--suave); margin: 4px 0 12px; }
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 24px; margin-bottom: 16px; }

.campo { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
.grade .campo { margin-bottom: 0; }
.campo > label, .grupo > legend, .rot { font-size: 14px; font-weight: 600; padding: 0; }
.obr { color: var(--vermelho); }
input[type=text], select, textarea { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #888; border-radius: 6px; background: #fff; }
textarea { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px dashed #c2850c; outline-offset: 2px; }
input:disabled { background: var(--cinza-2); border-color: #bbb; color: #333; }
.grupo { border: 0; margin: 0 0 16px; padding: 0; }
.grupo .ops { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 6px; }
.grupo .ops label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
input[type=radio], input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--azul); margin: 0; }
.marcas { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px 24px; margin-bottom: 16px; }
.marcas label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.recuo { border-left: 4px solid var(--azul-claro); padding: 4px 0 1px 16px; margin: 0 0 16px; }

/* Dado importado do cadastro */
.origem { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 14px; background: var(--azul-suave); border-left: 4px solid var(--azul); font-size: 14px; }
.grade { align-items: start; }
.imp { background: var(--azul-suave); border-left: 4px solid var(--azul); border-radius: 0 6px 6px 0; padding: 8px 10px 10px; }
.selo { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 3px; background: var(--azul); color: #fff; font-size: 11px; font-weight: 600; vertical-align: 1px; }
.fonte { font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--suave); overflow-wrap: anywhere; }
.imp .linha { display: flex; gap: 8px; }
.imp .linha input { flex: 1; min-width: 0; }
.imp.div .linha input { text-decoration: line-through; color: #777; }
.lk { border: 0; background: none; padding: 0; color: var(--azul); cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
.lk:hover { text-decoration: underline; } .lk.perigo { color: var(--vermelho); }
.apurado { margin-top: 6px; padding: 10px 12px; background: var(--amarelo-bg); border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
.apurado label { font-size: 13px; font-weight: 600; }
.apurado .acoes { display: flex; gap: 16px; }

.aviso { display: flex; gap: 10px; padding: 10px 14px; margin: 0 0 16px; background: var(--amarelo-bg); border-left: 4px solid #ffcd07; font-size: 14px; }
.vazio { color: var(--suave); font-style: italic; margin-bottom: 12px; }

/* Anexos */
.anexar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin-bottom: 12px; }
.anexar .campo { flex: 1 1 260px; margin: 0; }
.arquivos { list-style: none; margin: 0 0 14px; padding: 0 0 0 10px; border-left: 2px solid var(--linha); }
.arquivos li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 4px 0; }
.arquivos li a { color: var(--azul); } .arquivos li small { color: var(--suave); }
.oculto { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* Mapa simulado */
.mapa { position: relative; height: 230px; border: 1px solid var(--linha); border-radius: 6px; overflow: hidden; background: linear-gradient(90deg, transparent 49%, #fff 49% 51%, transparent 51%) 0 0/120px 100%, linear-gradient(transparent 46%, #fff 46% 54%, transparent 54%) 0 0/100% 90px, #dfe9d8; }
.mapa .area { position: absolute; left: 42%; top: 30%; width: 110px; height: 70px; border: 2px solid var(--azul); background: rgba(19,81,180,.18); transform: rotate(-6deg); }
.mapa .pino { position: absolute; left: calc(42% + 46px); top: calc(30% + 22px); width: 16px; height: 16px; border-radius: 50%; background: var(--vermelho); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.mapa .barra { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; }
.mapa .nota { position: absolute; left: 8px; bottom: 8px; padding: 4px 8px; background: rgba(255,255,255,.9); font-size: 12px; border-radius: 4px; }

/* Botões */
.bt { height: 40px; padding: 0 24px; border-radius: 999px; border: 1px solid var(--azul); background: #fff; color: var(--azul); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; }
.bt:hover { background: var(--azul-suave); }
.bt.pri { background: var(--azul); color: #fff; } .bt.pri:hover { background: var(--azul-marinho); }
.bt.liso { border-color: transparent; }
.bt.peq { height: 32px; padding: 0 16px; font-size: 13px; }
.bt:disabled { opacity: .45; cursor: not-allowed; }
.rodape-acoes { display: flex; align-items: center; gap: 12px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--linha); }
.rodape-acoes .espaco { flex: 1; }

table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
th { text-align: left; padding: 12px; background: var(--cinza-2); color: var(--azul); font-weight: 600; font-size: 14px; }
td { padding: 12px; border-bottom: 1px solid var(--linha); vertical-align: top; }

.opcoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin: 8px 0 4px; }
.opcoes label { display: flex; gap: 12px; padding: 16px; border: 1px solid var(--linha); border-radius: 6px; cursor: pointer; }
.opcoes label.on { border-color: var(--azul); background: var(--azul-suave); }
.opcoes small { display: block; color: var(--suave); margin-top: 2px; }
.busca { display: flex; gap: 12px; max-width: 560px; margin-bottom: 6px; }

.item-rev { display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--cinza-2); }
.item-rev .tag { font-size: 11px; }
.tag.cinza { background: #636363; }
.ciente { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; cursor: pointer; }

.fim { text-align: center; padding: 34px 0 6px; }
.fim .ok { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%; background: var(--verde); color: #fff; font-size: 30px; display: grid; place-items: center; }
.fim h2 { font-size: 26px; font-weight: 400; margin-bottom: 8px; }
.fim p { color: var(--suave); max-width: 640px; margin: 0 auto 22px; }
.fim .dados { text-align: left; max-width: 720px; margin: 0 auto 24px; padding: 16px 20px; background: var(--cinza); }
.fim .acoes { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

details.sec { border-bottom: 1px solid var(--linha); }
details.sec:first-of-type { border-top: 1px solid var(--linha); margin-top: 20px; }
details.sec summary { display: flex; align-items: center; gap: 12px; padding: 14px 0 14px 18px; cursor: pointer; color: var(--azul); font-size: 17px; list-style: none; }
details.sec summary::-webkit-details-marker { display: none; }
details.sec summary::before { content: ''; width: 8px; height: 8px; border-right: 2px solid var(--azul); border-bottom: 2px solid var(--azul); transform: rotate(45deg); transition: transform .15s; }
details.sec[open] summary::before { transform: rotate(-135deg); }
details.sec summary small { margin-left: auto; color: var(--suave); font-size: 12px; }
details.sec .corpo { padding: 4px 0 18px 48px; }
details.sec .corpo .dados { padding-left: 0; }
.midia { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 14px; }
.foto { height: 230px; border-radius: 6px; background: var(--cinza-2); display: grid; place-items: center; color: var(--suave); }

.base { background: var(--azul-escuro); color: #fff; padding: 22px 40px; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-size: 13px; }
.base strong { font-size: 26px; letter-spacing: -.03em; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 12px 20px; background: var(--azul-escuro); color: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.3); z-index: 9; }

@media print { .proto, .topo, .trilha, .base, .rodape-acoes, .passos, .toast { display: none !important; } .pagina { padding: 0; } }
@media (max-width: 760px) {
  .topo, .base { padding-left: 16px; padding-right: 16px; } .pagina { padding: 16px 16px 40px; }
  .titulo-sis small, .topo .ico { display: none; } h1 { font-size: 24px; } .usuario { font-size: 0; padding: 4px; gap: 0; }
  .cab { flex-direction: column; align-items: flex-start; } .dados, details.sec .corpo { padding-left: 0; }
  .passos li { font-size: 12px; } .midia { grid-template-columns: 1fr; }
  .rodape-acoes { flex-wrap: wrap; } .imp .linha { flex-direction: column; align-items: flex-start; } .imp .linha input { flex: none; width: 100%; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* Protótipo funcional — dados simulados, estado guardado só neste navegador. */
const CHAVE = 'diagnostico-imovel-spunet-v7';
const ETAPAS = ['Dados do imóvel', 'Situação cartorial e dominial', 'Situação urbanística e caracterização',
  'Interferências e afetações', 'Revisão', 'Encaminhamentos e conclusão'];
const TIPOS_DOC = ['Planta (PDF)', 'Arquivo vetorial', 'Matrícula', 'Transcrição', 'Certidão cartorial',
  'Certidão de inexistência de registro', 'Memorial descritivo', 'Relatório técnico',
  'Despacho técnico conclusivo', 'Declaração ou ateste técnico', 'Documento judicial', 'Foto', 'Outros documentos'];
const INTERFERENCIAS = ['Faixa de fronteira', 'Faixa de segurança', 'Raio de 1.320 m de estabelecimento militar',
  'Faixa de 100 m da orla marítima', 'Faixa de domínio de ferrovia ou rodovia'];
const AFETACOES = ['Unidade de conservação', 'Terra indígena', 'Comunidade tradicional', 'Território quilombola',
  'Poligonal de porto organizado', 'PDISP', 'Área de regularização fundiária / REURB', 'Operacional RFFSA',
  'Patrimônio histórico tombado', 'Outra afetação'];
const PROVIDENCIAS = ['Realizar diligências internas ou externas', 'Elaborar ou ajustar peças técnicas',
  'Elaborar análise técnica de incorporação', 'Solicitar complementação documental', 'Outra providência'];
const TIPOS_IMOVEL = ['Gleba/Terreno/Lote com edificação', 'Gleba/Terreno/Lote sem edificação', 'Apartamento', 'Sala/Loja', 'Garagem', 'Espelho d\'água', 'Cavidade natural subterrânea'];
const CONCEITUACOES = ['Terreno de Marinha/acrescido', 'Marginal/acrescido', 'Nacional interior', 'Ilha costeira', 'Ilha fluvial', 'Praia', 'Mar territorial', 'Água pública de domínio da União', 'Manguezal'];
const AQUISICOES = ['Reversão', 'Compra', 'Dação em pagamento', 'Desapropriação amigável', 'Determinação judicial', 'Herança jacente', 'Permuta', 'Recebimento em Doação', 'Sucessão por Entidades da APF', 'Arrematação judicial', 'Registro por Apossamento Vintenário (RAV)', 'Usucapião', 'Expropriação (Lei 8.257/1991)', 'Encampação', 'Adjudicação', 'Desapropriação judicial', 'Indefinido'];
const foraDoCadastro = (texto) => `<p class="etapa-desc">${texto || 'Estes dados não constam do cadastro do SPUnet e são informados no diagnóstico.'}</p>`;
const DOCS_TECNICOS = ['Planta do loteamento', 'Planta (PDF)', 'Arquivo vetorial', 'Memorial descritivo'];
const REQ = { numero: 'ES58746/2025', servico: 'Solicitar imóvel para uso da administração pública e entidades sem fins lucrativos',
  abertura: '07/10/2025', nup: '19739.279516/2025-35' };
const IMOVEL = { nome: 'Gleba/Terreno/Lote com edificação', area: '1.250,00 m²' };
const LOC = [['CEP', '70040-010'], ['Logradouro', 'Esplanada dos Ministérios'], ['Número', 'Bloco K'],
  ['Complemento', 'Edifício-sede'], ['Bairro', 'Zona Cívico-Administrativa'], ['Município / UF', 'Brasília / DF']];

const inicial = () => ({ modo: 'modulo', tela: 'etapas', etapa: 1, origem: 'com', rip: '0000001.23456-78',
  sistema: 'SPUnet', v: {}, rev: {}, ocorr: [], prov: [], comp: [], inc: {}, arq: {}, tipoArq: {}, ciente: false });
let S = inicial();
try { const g = JSON.parse(localStorage.getItem(CHAVE)); if (g && g.v) S = Object.assign(inicial(), g); } catch (e) {}
const abertos = new Set();   // divergências com o painel aberto (não persiste)
let VIS = null;              // coleta dos campos visíveis, usada na visualização final

const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const gravar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch (e) {} };
const importado = () => S.origem === 'com';
const area = () => S.origem === 'area';
const semTxt = () => area() ? `Área — ${S.comp.length} componente(s)` : 'Imóvel sem RIP';
const val = (etapa, rotulo) => S.v[etapa + ':' + rotulo] ?? '';
const visto = (k, tipo) => { if (VIS) VIS.push({ k, tipo }); };
function toast(texto) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = texto;
  document.body.append(t); setTimeout(() => t.remove(), 2600);
}

/* ---------- componentes de formulário ---------- */
function campo(etapa, rotulo, o = {}) {
  const k = etapa + ':' + rotulo; visto(k, 'campo');
  const attrs = `data-k="${esc(k)}" placeholder="${esc(o.ph || '')}"`;
  return `<div class="campo"><label>${esc(rotulo)}${o.obr ? ' <span class="obr">*</span>' : ''}</label>${o.area ?
    `<textarea ${attrs}>${esc(S.v[k])}</textarea>` : `<input type="text" ${attrs} value="${esc(S.v[k])}">`}</div>`;
}
function escolha(etapa, rotulo, opcoes) {
  const k = etapa + ':' + rotulo; visto(k, 'campo');
  return `<fieldset class="grupo"><legend>${esc(rotulo)}</legend><div class="ops">${opcoes.map((op) =>
    `<label><input type="radio" name="${esc(k)}" data-k="${esc(k)}" value="${esc(op)}"${S.v[k] === op ? ' checked' : ''}>${esc(op)}</label>`).join('')}</div></fieldset>`;
}
function imp(etapa, rotulo, valor, opcoes, fonte) {
  const k = etapa + ':' + rotulo;
  const cab = `<label>${esc(rotulo)}<span class="selo">${esc(S.sistema)}</span></label>`;
  const rodape = fonte ? `<span class="fonte">${esc(S.sistema)} · ${esc(fonte)}</span>` : '';
  FONTE[k] = fonte || '';
  if (valor === '') {   // veio vazio do cadastro: pode ser preenchido no diagnóstico
    visto(k, 'campo'); delete IMP[k]; VAZIO[k] = true;
    return `<div class="campo imp">${cab}${opcoes ? `<select data-k="${esc(k)}"><option value="">Vazio no ${esc(S.sistema)} — selecione, se apurado</option>${opcoes.map((op) =>

const siapa = () => importado() && S.sistema === 'SIAPA';
function montar(etapa, lista) {
  if (!importado()) {   // sem RIP: mesma estrutura do SPUnet, tudo informado no diagnóstico
    let h = '', g = '';
    const fecha = () => { if (g) { h += `<div class="grade">${g}</div>`; g = ''; } };
    lista.forEach(([rotulo, f]) => {
      if (!f.semRip && ('spunet' in f ? !f.spunet : Boolean(f.siapa))) return;
      if (f.op) { fecha(); h += escolha(etapa, rotulo, f.op); } else g += campo(etapa, rotulo, f.o);

  let dest = '', campos = '', escolhas = '';
  lista.forEach(([rotulo, f]) => {

}

function divergencias() {
  return Object.keys(S.rev).filter((k) => S.rev[k] && IMP[k] !== undefined && S.rev[k] !== IMP[k])

function lacunas() {
  const l = [];

  if (area()) {

    S.ocorr.forEach((o) => falta(!(S.inc[o] || []).length, `Etapa 4 — Incidência de “${o}” não indicada`));
  } else if (!importado()) {
    falta(!val(1, 'Processo SEI do imóvel'), 'Etapa 1 — Processo SEI do imóvel não informado');
    falta(!val(1, 'CEP'), 'Etapa 1 — CEP não informado');
    falta(!val(2, 'Tipo de registro'), 'Etapa 2 — Tipo de registro não informado');
    falta(!val(2, 'Forma de incorporação'), 'Etapa 2 — Forma de incorporação não informada');
  }
  [['Há planta do imóvel?', 'da planta do imóvel'], ['Há arquivo vetorial?', 'do arquivo vetorial'], ['Há memorial descritivo?', 'do memorial descritivo']]
    .forEach(([r, t]) => falta(!val(3, r), `Etapa 3 — Disponibilidade ${t} não informada`));

  return l;
}

      <button class="bt pri" id="avancar" data-a="avancar"${S.etapa === 6 && !podeConcluir() ? ' disabled' : ''}>${S.etapa === 6 ? 'Concluir diagnóstico' : 'Salvar e continuar'}</button></div>`;
  } else h += { origem: telaOrigem, pesquisa: telaPesquisa, resultado: telaResultado, concluido: telaConcluido, ver: telaVer, ajustes: telaAjustes }[S.tela]();
  h += `</main><footer class="base"><strong>gov.br</strong><span>Protótipo funcional com dados simulados · CGGES — Escritório de Processos</span></footer>`;
  const y = window.scrollY;
  document.getElementById('app').innerHTML = h;
  window.scrollTo(0, topo ? 0 : y);
  gravar();
}

/* ---------- ações ---------- */
const ir = (tela, etapa) => { S.tela = tela; if (etapa) S.etapa = etapa; render(true); };
const A = {
  nada() {},
  modo(el) {
    S.modo = el.dataset.id;
    if (S.modo === 'modulo') { if (!['etapas', 'concluido', 'ver', 'ajustes'].includes(S.tela)) S.tela = 'etapas'; }
    else if (S.tela === 'etapas' && S.etapa === 1 && !Object.keys(S.v).length) S.tela = 'origem';
    render(true);
  },
  indicado(el) { const id = el.dataset.id; S.origem = id === 'sem' || id === 'area' ? id : 'com'; if (S.origem === 'com') { S.sistema = id === 'siapa' ? 'SIAPA' : 'SPUnet'; S.rip = id === 'siapa' ? '9701 0101116-29' : '0000001.23456-78'; } S.tela = 'etapas'; render(); },
  limpar() { if (confirm('Apagar tudo o que foi preenchido e recomeçar?')) { const m = S.modo; S = inicial(); S.modo = m; if (m !== 'modulo') S.tela = 'origem'; abertos.clear(); render(true); } },
  origemOk() { S.etapa = 1; ir(importado() ? 'pesquisa' : 'etapas'); },
  irOrigem() { ir('origem'); }, irPesquisa() { ir('pesquisa'); },
  pesquisar() { S.rip = document.getElementById('rip').value.trim() || S.rip; S.sistema = S.rip.endsWith('9') ? 'SIAPA' : 'SPUnet'; ir('resultado'); },
  importar() { ir('etapas', 1); },
  etapa(el) { S.etapa = Number(el.dataset.id); render(true); },
  voltar() {
    if (S.etapa > 1) return ir('etapas', S.etapa - 1);
    if (S.modo === 'modulo') return toast('Volta ao passo 2 — Imóvel (fora deste protótipo).');
    ir(importado() ? 'resultado' : 'origem');
  },
  salvar() { gravar(); toast('Rascunho salvo neste navegador.'); },
  avancar() { if (S.etapa < 6) ir('etapas', S.etapa + 1); else if (podeConcluir()) ir('concluido'); },
  reabrir() { ir('etapas', 6); }, concluido() { ir('concluido'); }, ver() { ir('ver'); },
  ajustes() { ir('ajustes'); }, imprimir() { window.print(); },
  baixar() { toast('Download do relatório simulado.'); },
  termo() { toast('Minuta do Termo de Incorporação preparada (simulação).'); },
  abrirDiv(el) { abertos.add(el.dataset.key); render(); document.querySelector(`[data-rev="${CSS.escape(el.dataset.key)}"]`)?.focus(); },
  fecharDiv(el) { abertos.delete(el.dataset.key); render(); },
  removerDiv(el) { abertos.delete(el.dataset.key); definirRev(el.dataset.key, ''); render(); },
  removerArq(el) {
    if (!confirm('Excluir este arquivo da etapa?')) return;
    const n = el.dataset.etapa; S.arq[n] = (S.arq[n] || []).filter((f) => String(f.id) !== el.dataset.id); render();
  },
  addComp() {
    const g = (id) => document.getElementById(id).value.trim();
    const tipo = g('comp-tipo'), rip = g('comp-rip'), ar = g('comp-area'), mat = g('comp-mat');
    if (!tipo) return toast('Selecione o tipo de componente.');
    if (tipo.startsWith('Imóvel com RIP') && !rip) return toast('Informe o RIP do imóvel.');
    if (tipo !== 'Imóvel com RIP — inteiro' && !ar) return toast('Informe a área abrangida.');
    S.comp.push({ id: Date.now(), tipo, rip: tipo === 'Trecho sem RIP' ? '' : rip, area: ar, mat }); render();
  },
  removerComp(el) { if (confirm('Excluir este componente da área?')) { S.comp = S.comp.filter((c) => String(c.id) !== el.dataset.id); Object.keys(S.inc).forEach((k) => { S.inc[k] = S.inc[k].filter((x) => x !== el.dataset.id); }); S.prov.forEach((p) => { if (p.ref) p.ref = p.ref.filter((x) => x !== el.dataset.id); }); render(); } },
  addProv() {
    const tipo = document.getElementById('prov-tipo').value, det = document.getElementById('prov-det').value.trim();
    if (!tipo || !det) return toast('Selecione a providência e informe o detalhamento.');
    let ref;
    if (area()) {
      ref = [...document.querySelectorAll('.prov-ref:checked')].map((e) => e.value);
      if (ref.includes('todos')) ref = ['todos'];
      if (!ref.length) return toast('Indique a que a providência se refere.');
    }
    S.prov.push({ id: Date.now(), tipo, det, ref }); render();
  },
  removerProv(el) { if (confirm('Excluir esta providência?')) { S.prov = S.prov.filter((p) => String(p.id) !== el.dataset.id); render(); } },
};
function definirRev(k, valor) {
  if (valor) S.rev[k] = valor; else delete S.rev[k];
  if (k === '3:O imóvel integra loteamento?' && valor && valor !== 'Sim') {
    ['3:Loteamento, quadra e lote', '3:Documento SEI da planta do loteamento'].forEach((d) => { delete S.rev[d]; abertos.delete(d); });
  }
}
const app = document.getElementById('app');
app.addEventListener('click', (e) => { const el = e.target.closest('[data-a]'); if (el && !el.disabled) A[el.dataset.a](el); });
app.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.k && el.type !== 'radio') {
    S.v[el.dataset.k] = el.value; gravar();
    if (S.etapa === 6) { const b = document.getElementById('avancar'); if (b) b.disabled = !podeConcluir(); }
  } else if (el.dataset.rev && el.tagName === 'INPUT') {
    definirRev(el.dataset.rev, el.value.trim()); gravar();
    el.closest('.imp').classList.toggle('div', Boolean(el.value.trim()) && el.value.trim() !== IMP[el.dataset.rev]);
  }
});
app.addEventListener('change', (e) => {
  const el = e.target;
  if (el.type === 'radio' && el.dataset.k) {
    const k = el.dataset.k, cat = k === '4:Há interferências?' ? INTERFERENCIAS : k === '4:Há afetações?' ? AFETACOES : null;
    if (cat && el.value === 'Não' && S.ocorr.some((o) => cat.includes(o))) {
      if (!confirm('Alterar para Não removerá as ocorrências selecionadas. Continuar?')) return render();
      S.ocorr = S.ocorr.filter((o) => !cat.includes(o));
    }
    const doc = { '3:Há planta do imóvel?': 'Planta (PDF)', '3:Há arquivo vetorial?': 'Arquivo vetorial', '3:Há memorial descritivo?': 'Memorial descritivo' }[k];
    if (doc && el.value === 'Não' && (S.arq[3] || []).some((f) => f.cat === doc)) {
      if (!confirm('Alterar para Não removerá os arquivos anexados. Continuar?')) return render();
      S.arq[3] = S.arq[3].filter((f) => f.cat !== doc);
    }
    S.v[k] = el.value; render();
  } else if (el.dataset.origem) { S.origem = el.dataset.origem; render(); }
  else if (el.classList.contains('prov-ref')) {
    if (el.checked) document.querySelectorAll('.prov-ref').forEach((x) => { if ((x.value === 'todos') !== (el.value === 'todos')) x.checked = false; });
  }
  else if (el.dataset.inc) {
    const item = el.dataset.inc, id = el.dataset.comp; let l = S.inc[item] || [];
    l = !el.checked ? l.filter((x) => x !== id) : id === 'todos' ? ['todos'] : [...l.filter((x) => x !== 'todos'), id];
    S.inc[item] = l; render();
  }
  else if (el.dataset.oc) { const o = el.dataset.oc; S.ocorr = el.checked ? [...S.ocorr, o] : S.ocorr.filter((x) => x !== o); if (!el.checked) delete S.inc[o]; render(); }
  else if (el.dataset.rev && el.tagName === 'SELECT') { definirRev(el.dataset.rev, el.value); render(); }
  else if (el.dataset.tipoarq) { S.tipoArq[el.dataset.tipoarq] = el.value; render(); }
  else if (el.dataset.arq) {
    const n = el.dataset.arq, cat = el.dataset.cat || S.tipoArq[n] || 'Sem tipologia', agora = Date.now();
    S.arq[n] = [...(S.arq[n] || []), ...Array.from(el.files).map((f, i) => ({ id: agora + i, nome: f.name, cat }))]; render();
  } else if (el.id === 'ciente') { S.ciente = el.checked; gravar(); document.getElementById('avancar').disabled = !podeConcluir(); }
});
// registra os valores importados (necessário para divergências ao recarregar direto na revisão)
VIS = []; [etapa1, etapa2, etapa3, etapa4].forEach((f) => f()); VIS = null;
render(true);
</script>
